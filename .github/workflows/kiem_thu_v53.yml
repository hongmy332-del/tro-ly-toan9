
name: Kiem thu V5.3 KHKT

on:
  push:
    branches:
      - khkt-v5.3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kiem-thu:
    runs-on: ubuntu-latest

    steps:
      - name: Tai ma nguon
        uses: actions/checkout@v4

      - name: Cai dat Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kiem tra cu phap Python
        run: |
          python -m py_compile circle_tutor.py
          python -m py_compile khkt_v53.py
          python -m py_compile test_khkt_v53.py

      - name: Chay bo kiem thu V5.3
        run: |
          python -m unittest -v test_khkt_v53.py
